<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#1b6e3c">
<title>North County Grocery Deals</title>
<style>
  :root {
    --green: #1b6e3c;
    --green-dark: #145a30;
    --bg: #f5f7f5;
    --card: #ffffff;
    --border: #e0e4e0;
    --text: #1f2a24;
    --muted: #667069;
    --notable: #fff4d6;
    --notable-border: #e0b429;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--green);
    color: white;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 17px;
    margin: 0;
    font-weight: 600;
  }
  header button {
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  header button:hover { background: rgba(255,255,255,0.25); }

  main { max-width: 900px; margin: 0 auto; padding: 12px; }

  /* Login / set-password screens */
  .auth-wrap {
    max-width: 380px;
    margin: 60px auto;
    padding: 28px 24px;
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .auth-wrap h2 { margin-top: 0; text-align: center; color: var(--green-dark); }
  .auth-wrap p.sub { text-align: center; color: var(--muted); font-size: 14px; margin-top: -8px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 4px; }
  input[type=email], input[type=password], input[type=text], select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: white;
    color: var(--text);
  }
  .btn-primary {
    width: 100%;
    margin-top: 20px;
    padding: 11px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .error-msg { color: #b3261e; font-size: 13px; margin-top: 10px; text-align: center; }
  .info-msg { color: var(--muted); font-size: 13px; margin-top: 10px; text-align: center; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    margin: 14px 0 10px;
    overflow-x: auto;
  }
  .tab-btn {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: white;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab-btn.active { background: var(--green); color: white; border-color: var(--green); }

  /* Filters */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .filters > * { flex: 1 1 140px; }

  /* Cards */
  .card-list { display: flex; flex-direction: column; gap: 8px; }
  .deal-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .deal-card.notable { background: var(--notable); border-color: var(--notable-border); }
  .deal-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .deal-item { font-weight: 600; font-size: 15px; }
  .deal-price { font-weight: 700; color: var(--green-dark); font-size: 15px; white-space: nowrap; }
  .deal-card-row { display: flex; gap: 10px; align-items: flex-start; }
  .deal-thumb {
    width: 56px;
    height: 56px;
    object-fit: contain;
    border-radius: 8px;
    background: #f5f7f5;
    border: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .deal-card-body { flex: 1 1 auto; min-width: 0; }
  .deal-meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .store-logo {
    height: 18px;
    width: 18px;
    object-fit: contain;
    border-radius: 4px;
    background: #fff;
    border: 1px solid var(--border);
    padding: 1px;
    vertical-align: middle;
    margin-right: 2px;
  }
  .store-logo-fallback { font-size: 13px; color: var(--muted); }
  .deal-notes { font-size: 13px; margin-top: 6px; color: var(--text); }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 10px;
    background: var(--green);
    color: white;
    margin-left: 6px;
  }
  .badge.match-badge { background: #2b6cb0; }
  .clip-link {
    display: inline-block;
    margin-top: 8px;
    padding: 7px 16px;
    font-size: 13px;
    color: white;
    background: var(--green);
    font-weight: 600;
    text-decoration: none;
    border-radius: 6px;
  }
  .clip-link:hover { background: var(--green-dark); text-decoration: none; }
  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 40px 10px;
    font-size: 14px;
  }
  .loading { text-align: center; color: var(--muted); padding: 30px; font-size: 14px; }
  .count-row { font-size: 13px; color: var(--muted); margin-bottom: 8px; }

  /* Want list add/edit/delete */
  .add-item-row { margin-bottom: 10px; }
  .add-item-row button {
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    background: var(--green);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .add-item-row button:hover { background: var(--green-dark); }
  .want-form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .want-form label { margin: 10px 0 4px; }
  .want-form .form-row { display: flex; gap: 8px; }
  .want-form .form-row > div { flex: 1; }
  .want-form .form-actions { display: flex; gap: 8px; margin-top: 16px; }
  .want-form .form-actions button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .want-form .btn-save { background: var(--green); color: white; }
  .want-form .btn-save:hover { background: var(--green-dark); }
  .want-form .btn-save:disabled { opacity: 0.6; cursor: default; }
  .want-form .btn-cancel { background: #eee; color: var(--text); }
  .form-error { color: #b3261e; font-size: 13px; margin-top: 8px; }
  .card-actions { display: flex; gap: 8px; margin-top: 8px; }
  .btn-small {
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: white;
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
  }
  .btn-small:hover { background: var(--bg); }
  .btn-small.danger { color: #b3261e; border-color: #f0c9c5; }
  .btn-small.danger:hover { background: #fdf0ef; }
  .btn-small.got-it-btn { color: var(--green-dark); border-color: var(--green); font-weight: 600; }
  .btn-small.got-it-btn:hover { background: var(--notable, #eef7ee); }

  /* Buy checkbox */
  .buy-check {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    color: var(--text);
    margin-top: 8px;
    cursor: pointer;
    user-select: none;
  }
  .buy-check input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }

  /* Want list category grouping */
  .category-header {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--green-dark);
    margin: 18px 0 8px;
    padding-bottom: 4px;
    border-bottom: 2px solid var(--green);
  }
  .category-header:first-child { margin-top: 0; }
  .category-count { font-weight: 400; text-transform: none; color: var(--muted); font-size: 12px; }

  #app-screen { display: none; }
  .error-banner { background:#fdecea; border:1px solid #f5c2bd; color:#b3261e; border-radius:8px; padding:10px 34px 10px 12px; margin:10px 0; font-size:14px; position:relative; }
  .error-banner .dismiss { position:absolute; right:6px; top:4px; border:none; background:none; color:#b3261e; font-size:20px; line-height:1; cursor:pointer; padding:2px 6px; }
  .badge.expired-badge { background:#b26a00; }
  .buy-check.clip-check { margin-left:14px; }
  .tab-btn .category-count { margin-left:4px; }
  .added-by { color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>🛒 North County Grocery Deals</h1>
  <button id="logout-btn" style="display:none;">Log out</button>
</header>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="auth-wrap">
    <h2>Sign in</h2>
    <p class="sub">Bill &amp; Selaina's shared deals tracker</p>
    <form id="login-form">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" required autocomplete="email">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" required autocomplete="current-password">
      <button type="submit" class="btn-primary" id="login-btn">Sign in</button>
      <div class="error-msg" id="login-error"></div>
    </form>
  </div>
</div>

<!-- SET PASSWORD SCREEN (shown after clicking an invite/reset email link) -->
<div id="setpw-screen" style="display:none;">
  <div class="auth-wrap">
    <h2>Set your password</h2>
    <p class="sub">Choose a password for your account</p>
    <form id="setpw-form">
      <label for="setpw-password">New password</label>
      <input type="password" id="setpw-password" required minlength="6" autocomplete="new-password">
      <label for="setpw-password2">Confirm password</label>
      <input type="password" id="setpw-password2" required minlength="6" autocomplete="new-password">
      <button type="submit" class="btn-primary" id="setpw-btn">Save password &amp; continue</button>
      <div class="error-msg" id="setpw-error"></div>
    </form>
  </div>
</div>

<!-- MAIN APP -->
<div id="app-screen">
  <main>
    <div class="tabs">
      <button class="tab-btn active" data-tab="weekly_deals">Weekly Deals</button>
      <button class="tab-btn" data-tab="want_list">Want List</button>
      <button class="tab-btn" data-tab="digital_coupons">Digital Coupons</button>
      <button class="tab-btn" data-tab="my_matches">For My Want List</button>
      <button class="tab-btn" data-tab="shopping_list">Shopping List <span id="shop-count" class="category-count"></span></button>
    </div>

    <div class="filters" id="filters"></div>
    <div id="want-controls"></div>
    <div id="error-banner" class="error-banner" style="display:none"></div>
    <div class="count-row" id="count-row"></div>
    <div id="results" class="card-list"><div class="loading">Loading…</div></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://msvqftqcnianiwramndq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_G52DGh6WwcFuq_IkH97OLQ_5f5Rb5M_";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STORES = ["WinCo","Stater Bros","Albertsons","Ralphs","Grocery Outlet","Vons","Walmart","Smart & Final","Sprouts Farmers Market","CVS","Walgreens"];
const CATEGORIES = ["Produce","Meat & Seafood","Dairy & Eggs","Bakery","Frozen","Pantry/Canned & Dry Goods","Beverages","Snacks","Household & Cleaning","Health & Beauty","Baby & Kids","Pet Supplies","Other"];
const STORE_DOMAINS = {
  "WinCo": "wincofoods.com",
  "Stater Bros": "staterbros.com",
  "Albertsons": "albertsons.com",
  "Ralphs": "ralphs.com",
  "Grocery Outlet": "groceryoutlet.com",
  "Vons": "vons.com",
  "Walmart": "walmart.com",
  "Smart & Final": "smartandfinal.com",
  "Sprouts Farmers Market": "sprouts.com",
  "CVS": "cvs.com",
  "Walgreens": "walgreens.com"
};

function handleLogoError(el) {
  const span = document.createElement("span");
  span.textContent = el.dataset.store || "";
  span.className = "store-logo-fallback";
  el.replaceWith(span);
}

// Cards reuse only 11 distinct store logo URLs across hundreds of rows.
// Rendering 300+ <img> tags that all point at the same handful of URLs
// causes many of those duplicate-URL requests to hang indefinitely in
// some browsers. (An earlier attempt to fix this by fetch()-ing each icon
// once and embedding it as a data URL didn't work: Google's favicon
// endpoint doesn't send CORS headers, so fetch()'s response body can't be
// read at all, even though the exact same URL displays fine in an <img>.)
// The fix instead warms the browser's own HTTP cache: load each of the 11
// icons once via a standalone Image(), and only start rendering cards once
// every one of those has settled (loaded, errored, or timed out). By the
// time the 300+ card <img> tags request those same URLs, the browser can
// serve them straight from cache instead of racing duplicate network
// requests.
const logoPreloadPromise = (async function preloadStoreLogos() {
  const domains = [...new Set(Object.values(STORE_DOMAINS))];
  await Promise.all(domains.map((domain) => new Promise((resolve) => {
    const img = new Image();
    const done = () => resolve();
    img.onload = done;
    img.onerror = done; // don't let one bad domain block the rest forever
    setTimeout(done, 4000); // safety net in case neither event fires
    img.src = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
  })));
})();

function storeLogo(store) {
  if (!store) return "";
  const domain = STORE_DOMAINS[store];
  if (!domain) return `<span class="store-logo-fallback">${esc(store)}</span>`;
  const url = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
  return `<img class="store-logo" src="${url}" alt="${esc(store)}" title="${esc(store)}" data-store="${esc(store)}" onerror="handleLogoError(this)">`;
}

let currentTab = "weekly_deals";
let currentFilters = { store: "", category: "", q: "", showExpired: false };
const TAB_NAMES = ["weekly_deals", "want_list", "digital_coupons", "my_matches", "shopping_list"];

const loginScreen = document.getElementById("login-screen");
const setpwScreen = document.getElementById("setpw-screen");
const appScreen = document.getElementById("app-screen");
const logoutBtn = document.getElementById("logout-btn");

function showScreen(name) {
  loginScreen.style.display = name === "login" ? "block" : "none";
  setpwScreen.style.display = name === "setpw" ? "block" : "none";
  appScreen.style.display = name === "app" ? "block" : "none";
  logoutBtn.style.display = name === "app" ? "inline-block" : "none";
}

// --- Auth wiring ---
const hash = window.location.hash;
let cameFromInviteOrRecovery = /type=invite|type=recovery/.test(hash);

sb.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY" || (cameFromInviteOrRecovery && session)) {
    showScreen("setpw");
    cameFromInviteOrRecovery = false; // only force this once
  } else if (session) {
    showScreen("app");
    initApp();
  } else {
    showScreen("login");
  }
});

sb.auth.getSession().then(({ data }) => {
  if (!data.session && !cameFromInviteOrRecovery) {
    showScreen("login");
  }
});

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const btn = document.getElementById("login-btn");
  const errEl = document.getElementById("login-error");
  errEl.textContent = "";
  btn.disabled = true;
  btn.textContent = "Signing in…";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  btn.textContent = "Sign in";
  if (error) errEl.textContent = error.message;
});

document.getElementById("setpw-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const p1 = document.getElementById("setpw-password").value;
  const p2 = document.getElementById("setpw-password2").value;
  const errEl = document.getElementById("setpw-error");
  errEl.textContent = "";
  if (p1 !== p2) { errEl.textContent = "Passwords don't match."; return; }
  const btn = document.getElementById("setpw-btn");
  btn.disabled = true;
  btn.textContent = "Saving…";
  const { error } = await sb.auth.updateUser({ password: p1 });
  btn.disabled = false;
  btn.textContent = "Save password & continue";
  if (error) { errEl.textContent = error.message; return; }
  history.replaceState(null, "", window.location.pathname);
  showScreen("app");
  initApp();
});

logoutBtn.addEventListener("click", async () => {
  await sb.auth.signOut();
  showScreen("login");
});

// --- App logic ---
let appInited = false;
function initApp() {
  if (appInited) { loadData(); return; }
  appInited = true;
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      activateTab(btn.dataset.tab);
      updateHash();
      renderFilters();
      renderWantControls();
      loadData();
    });
  });
  applyHash();
  renderFilters();
  renderWantControls();
  loadData();
  refreshShopCount();

  const resultsEl = document.getElementById("results");
  resultsEl.addEventListener("change", async (e) => {
    const clipCb = e.target.closest(".clip-checkbox");
    if (clipCb) {
      const checked = clipCb.checked;
      clipCb.disabled = true;
      const { error } = await sb.from("digital_coupons").update({ clipped: checked }).eq("id", clipCb.dataset.id);
      clipCb.disabled = false;
      if (error) {
        showError("Couldn't save that: " + error.message);
        clipCb.checked = !checked;
      } else {
        clearError();
      }
      return;
    }
    const cb = e.target.closest(".buy-checkbox");
    if (!cb) return;
    const table = cb.dataset.table;
    const id = cb.dataset.id;
    const checked = cb.checked;
    cb.disabled = true;
    const who = checked ? await currentUserLabel() : null;
    const { error } = await sb.from(table).update({ intending_to_buy: checked, intending_to_buy_by: who }).eq("id", id);
    cb.disabled = false;
    if (error) {
      showError("Couldn't save that: " + error.message);
      cb.checked = !checked;
    } else {
      clearError();
      refreshShopCount();
    }
  });
  resultsEl.addEventListener("click", async (e) => {
    const btn = e.target.closest(".got-it-btn");
    if (!btn) return;
    const table = btn.dataset.table;
    const id = btn.dataset.id;
    btn.disabled = true;
    btn.textContent = "…";
    const patch = { intending_to_buy: false, intending_to_buy_by: null };
    if (table === "digital_coupons") patch.clipped = false;
    const { error } = await sb.from(table).update(patch).eq("id", id);
    if (error) {
      showError("Couldn't save that: " + error.message);
      btn.disabled = false;
      btn.textContent = "✓ Got it";
      return;
    }
    clearError();
    refreshShopCount();
    loadData();
  });
}

// --- Want list add / edit / delete ---
let editingWantId = null;

function renderWantControls() {
  const el = document.getElementById("want-controls");
  if (currentTab !== "want_list") { el.innerHTML = ""; return; }
  editingWantId = null;
  el.innerHTML = `
    <div class="add-item-row">
      <button type="button" id="add-item-btn">+ Add item</button>
    </div>
    <div class="want-form" id="want-form" style="display:none;">
      <label for="wf-item">Item</label>
      <input type="text" id="wf-item" placeholder="e.g. Ground beef">
      <div class="form-row">
        <div>
          <label for="wf-category">Category</label>
          <select id="wf-category">
            <option value="">None</option>
            ${CATEGORIES.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("")}
          </select>
        </div>
        <div>
          <label for="wf-priority">Priority</label>
          <select id="wf-priority">
            <option value="">None</option>
            <option value="A">A (highest)</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D (lowest)</option>
          </select>
        </div>
      </div>
      <label for="wf-notes">Notes</label>
      <input type="text" id="wf-notes" placeholder="optional">
      <div class="form-actions">
        <button type="button" class="btn-cancel" id="wf-cancel">Cancel</button>
        <button type="button" class="btn-save" id="wf-save">Save</button>
      </div>
      <div class="form-error" id="wf-error"></div>
    </div>
  `;
  document.getElementById("add-item-btn").addEventListener("click", () => openWantForm(null));
  document.getElementById("wf-cancel").addEventListener("click", closeWantForm);
  document.getElementById("wf-save").addEventListener("click", saveWantItem);
}

function openWantForm(row) {
  editingWantId = row ? row.id : null;
  document.getElementById("want-form").style.display = "block";
  document.getElementById("wf-item").value = row ? (row.item || "") : "";
  document.getElementById("wf-category").value = row ? (row.category || "") : "";
  document.getElementById("wf-priority").value = row ? (row.priority || "") : "";
  document.getElementById("wf-notes").value = row ? (row.notes || "") : "";
  document.getElementById("wf-error").textContent = "";
  document.getElementById("wf-item").focus();
  document.getElementById("want-form").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function closeWantForm() {
  editingWantId = null;
  const form = document.getElementById("want-form");
  if (form) {
    form.style.display = "none";
    document.getElementById("wf-error").textContent = "";
  }
}

async function saveWantItem() {
  const item = document.getElementById("wf-item").value.trim();
  const category = document.getElementById("wf-category").value || null;
  const priority = document.getElementById("wf-priority").value || null;
  const notes = document.getElementById("wf-notes").value.trim() || null;
  const errEl = document.getElementById("wf-error");
  errEl.textContent = "";
  if (!item) { errEl.textContent = "Item name is required."; return; }

  const saveBtn = document.getElementById("wf-save");
  saveBtn.disabled = true;
  saveBtn.textContent = "Saving…";

  let error;
  if (editingWantId) {
    ({ error } = await sb.from("want_list").update({ item, category, priority, notes }).eq("id", editingWantId));
  } else {
    const { data: userData } = await sb.auth.getUser();
    const addedBy = (userData && userData.user && userData.user.email) ? userData.user.email.split("@")[0] : null;
    const today = new Date().toISOString().slice(0, 10);
    ({ error } = await sb.from("want_list").insert({ item, category, priority, notes, added_by: addedBy, date_added: today }));
  }

  saveBtn.disabled = false;
  saveBtn.textContent = "Save";

  if (error) { errEl.textContent = error.message; return; }
  closeWantForm();
  loadData();
}

async function deleteWantItem(id, itemName) {
  if (!confirm(`Remove "${itemName}" from your want list?`)) return;
  const { error } = await sb.from("want_list").delete().eq("id", id);
  if (error) { showError("Couldn't delete that: " + error.message); return; }
  loadData();
}

function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function isExpired(tab, r) {
  const t = todayISO();
  if (tab === "weekly_deals") return !!(r.sale_end && r.sale_end < t);
  return !!(r.expires_on && r.expires_on < t);
}

function showError(msg) {
  const el = document.getElementById("error-banner");
  if (!el) return;
  el.innerHTML = esc(msg) + `<button type="button" class="dismiss" aria-label="Dismiss">&times;</button>`;
  el.style.display = "block";
  el.querySelector(".dismiss").addEventListener("click", clearError);
}

function clearError() {
  const el = document.getElementById("error-banner");
  if (el) { el.style.display = "none"; el.innerHTML = ""; }
}

async function currentUserLabel() {
  try {
    const { data } = await sb.auth.getUser();
    const email = data && data.user ? data.user.email : "";
    return email ? email.split("@")[0] : null;
  } catch (e) { return null; }
}

async function refreshShopCount() {
  const el = document.getElementById("shop-count");
  if (!el) return;
  try {
    const [w, c] = await Promise.all([
      sb.from("weekly_deals").select("id", { count: "exact", head: true }).eq("intending_to_buy", true),
      sb.from("digital_coupons").select("id", { count: "exact", head: true }).eq("intending_to_buy", true)
    ]);
    const n = (w.count || 0) + (c.count || 0);
    el.textContent = n ? "(" + n + ")" : "";
  } catch (e) { el.textContent = ""; }
}

// Live want-list matching. Word boundaries keep "milk" from matching "MUSCLE MILK",
// while still matching "almond milk" - which is what we want.
function wantMatchers(wantRows) {
  return (wantRows || []).map(w => ({
    item: w.item,
    re: new RegExp("\\b" + String(w.item || "").trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i")
  })).filter(x => x.item);
}

function findMatch(matchers, text) {
  if (!text) return null;
  const m = matchers.find(x => x.re.test(text));
  return m ? m.item : null;
}

function activateTab(tab) {
  if (TAB_NAMES.indexOf(tab) < 0) return;
  currentTab = tab;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
}

// #tab or #tab/StoreName - makes a filtered view textable to someone else.
function updateHash() {
  const parts = [currentTab];
  if (currentFilters.store) parts.push(encodeURIComponent(currentFilters.store));
  history.replaceState(null, "", "#" + parts.join("/"));
}

function applyHash() {
  const raw = (location.hash || "").slice(1);
  if (!raw || /type=(invite|recovery)/.test(location.hash)) return;
  const bits = raw.split("/");
  if (TAB_NAMES.indexOf(bits[0]) < 0) return;
  activateTab(bits[0]);
  if (bits[1]) {
    const decoded = decodeURIComponent(bits[1]);
    if (STORES.indexOf(decoded) >= 0) currentFilters.store = decoded;
  }
}

function renderFilters() {
  const el = document.getElementById("filters");
  const storeOptions = `<option value="">All stores</option>` + STORES.map(s => `<option value="${s}">${s}</option>`).join("");
  const catOptions = `<option value="">All categories</option>` + CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join("");

  let html = `<select id="f-store">${storeOptions}</select>`;
  if (currentTab !== "want_list" && currentTab !== "my_matches" && currentTab !== "shopping_list") {
    html += `<select id="f-category">${catOptions}</select>`;
  }
  html += `<input type="text" id="f-search" placeholder="Search item…">`;
  if (currentTab === "weekly_deals" || currentTab === "digital_coupons") {
    html += `<label class="buy-check"><input type="checkbox" id="f-expired"${currentFilters.showExpired ? " checked" : ""}> Show expired</label>`;
  }
  el.innerHTML = html;

  document.getElementById("f-store").value = currentFilters.store;
  document.getElementById("f-store").addEventListener("change", (e) => { currentFilters.store = e.target.value; updateHash(); loadData(); });
  const expEl = document.getElementById("f-expired");
  if (expEl) expEl.addEventListener("change", (e) => { currentFilters.showExpired = e.target.checked; loadData(); });
  const catSel = document.getElementById("f-category");
  if (catSel) {
    catSel.value = currentFilters.category;
    catSel.addEventListener("change", (e) => { currentFilters.category = e.target.value; loadData(); });
  }
  const searchEl = document.getElementById("f-search");
  searchEl.value = currentFilters.q;
  let debounceTimer;
  searchEl.addEventListener("input", (e) => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => { currentFilters.q = e.target.value; loadData(); }, 300);
  });
}

async function loadData() {
  await logoPreloadPromise;
  const resultsEl = document.getElementById("results");
  const countEl = document.getElementById("count-row");
  resultsEl.innerHTML = `<div class="loading">Loading…</div>`;

  let rows = [];
  let error = null;

  if (currentTab === "weekly_deals") {
    let q = sb.from("weekly_deals").select("*").order("notable", { ascending: false }).order("date_pulled", { ascending: false });
    if (currentFilters.store) q = q.eq("store", currentFilters.store);
    if (currentFilters.category) q = q.eq("category", currentFilters.category);
    if (currentFilters.q) q = q.ilike("item", `%${currentFilters.q}%`);
    if (!currentFilters.showExpired) q = q.or("sale_end.gte." + todayISO() + ",sale_end.is.null");
    ({ data: rows, error } = await q);
  } else if (currentTab === "want_list") {
    let q = sb.from("want_list").select("*").order("item", { ascending: true });
    if (currentFilters.store) q = q.eq("best_deal_store", currentFilters.store);
    if (currentFilters.q) q = q.ilike("item", `%${currentFilters.q}%`);
    ({ data: rows, error } = await q);
    if (rows) rows = sortWantList(rows);
  } else if (currentTab === "digital_coupons") {
    let q = sb.from("digital_coupons").select("*").order("date_pulled", { ascending: false });
    if (currentFilters.store) q = q.eq("store", currentFilters.store);
    if (currentFilters.q) q = q.ilike("item", `%${currentFilters.q}%`);
    if (!currentFilters.showExpired) q = q.or("expires_on.gte." + todayISO() + ",expires_on.is.null");
    ({ data: rows, error } = await q);
  } else if (currentTab === "my_matches") {
    // Matched live against the CURRENT want list, so an item added a minute ago shows
    // its matches right away instead of waiting for the next scheduled pull.
    let wq = sb.from("weekly_deals").select("*");
    let cq = sb.from("digital_coupons").select("*");
    if (currentFilters.store) { wq = wq.eq("store", currentFilters.store); cq = cq.eq("store", currentFilters.store); }
    if (!currentFilters.showExpired) {
      wq = wq.or("sale_end.gte." + todayISO() + ",sale_end.is.null");
      cq = cq.or("expires_on.gte." + todayISO() + ",expires_on.is.null");
    }
    const [wantRes, wRes, cRes] = await Promise.all([sb.from("want_list").select("id,item"), wq, cq]);
    error = wantRes.error || wRes.error || cRes.error || null;
    if (!error) {
      const matchers = wantMatchers(wantRes.data);
      const tag = (r, src) => {
        const m = findMatch(matchers, r.item) || findMatch(matchers, r.description);
        return m ? Object.assign({}, r, { _source: src, _match: m }) : null;
      };
      rows = (wRes.data || []).map(r => tag(r, "weekly_deals"))
        .concat((cRes.data || []).map(r => tag(r, "digital_coupons")))
        .filter(Boolean);
      if (currentFilters.q) {
        const needle = currentFilters.q.toLowerCase();
        rows = rows.filter(r => (r._match || "").toLowerCase().indexOf(needle) >= 0 ||
                                (r.item || "").toLowerCase().indexOf(needle) >= 0);
      }
      rows.sort((a, b) => {
        const byItem = a._match.localeCompare(b._match);
        if (byItem !== 0) return byItem;
        return (a._source === "digital_coupons" ? 0 : 1) - (b._source === "digital_coupons" ? 0 : 1);
      });
    }
  } else if (currentTab === "shopping_list") {
    // Everything currently checked "Buy" across Weekly Deals and Digital Coupons, shared by whoever's logged in.
    let wq = sb.from("weekly_deals").select("*").eq("intending_to_buy", true);
    let cq = sb.from("digital_coupons").select("*").eq("intending_to_buy", true);
    if (currentFilters.store) { wq = wq.eq("store", currentFilters.store); cq = cq.eq("store", currentFilters.store); }
    if (currentFilters.q) { wq = wq.ilike("item", `%${currentFilters.q}%`); cq = cq.ilike("item", `%${currentFilters.q}%`); }
    const [wRes, cRes] = await Promise.all([wq, cq]);
    if (wRes.error) error = wRes.error;
    else if (cRes.error) error = cRes.error;
    else {
      const weeklyRows = (wRes.data || []).map(r => ({ ...r, _source: "weekly_deals" }));
      const couponRows = (cRes.data || []).map(r => ({ ...r, _source: "digital_coupons" }));
      rows = weeklyRows.concat(couponRows);
      rows.sort((a, b) => (a.clipped ? 1 : 0) - (b.clipped ? 1 : 0));
    }
  }

  if (error) {
    resultsEl.innerHTML = `<div class="empty-state">Couldn't load data: ${error.message}</div>`;
    countEl.textContent = "";
    return;
  }

  clearError();
  countEl.textContent = `${rows.length} result${rows.length === 1 ? "" : "s"}`;

  if (!rows.length) {
    const emptyMsg = currentTab === "my_matches"
      ? "Nothing on sale matches your Want List right now. Add items on the Want List tab and matches appear here immediately."
      : currentTab === "shopping_list"
      ? `Nothing checked off yet. Check the "Buy" box on any Weekly Deal or Digital Coupon and it'll show up here, grouped by store.`
      : "No matching results yet. Try a different filter, or check back after the next scheduled pull.";
    resultsEl.innerHTML = `<div class="empty-state">${emptyMsg}</div>`;
    return;
  }

  if (currentTab === "want_list") {
    resultsEl.innerHTML = renderWantListGrouped(rows);
  } else if (currentTab === "shopping_list") {
    resultsEl.innerHTML = renderShoppingListGrouped(rows);
  } else {
    resultsEl.innerHTML = rows.map(r => renderCard(currentTab === "my_matches" ? r._source : currentTab, r, currentTab === "my_matches")).join("");
  }

  if (currentTab === "want_list") {
    resultsEl.querySelectorAll(".edit-want-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const row = rows.find(r => String(r.id) === btn.dataset.id);
        if (row) openWantForm(row);
      });
    });
    resultsEl.querySelectorAll(".delete-want-btn").forEach(btn => {
      btn.addEventListener("click", () => deleteWantItem(btn.dataset.id, btn.dataset.item));
    });
  }
}

const PRIORITY_ORDER = { A: 0, B: 1, C: 2, D: 3 };

function sortWantList(rows) {
  return rows.slice().sort((a, b) => {
    const pa = PRIORITY_ORDER[a.priority] ?? 99;
    const pb = PRIORITY_ORDER[b.priority] ?? 99;
    if (pa !== pb) return pa - pb;
    return (a.item || "").localeCompare(b.item || "");
  });
}

function renderWantListGrouped(rows) {
  const groups = new Map();
  rows.forEach(r => {
    const cat = r.category || "Uncategorized";
    if (!groups.has(cat)) groups.set(cat, []);
    groups.get(cat).push(r);
  });
  const known = CATEGORIES.filter(c => groups.has(c));
  const extra = [...groups.keys()].filter(c => c !== "Uncategorized" && !CATEGORIES.includes(c)).sort();
  const orderedCats = [...known, ...extra, ...(groups.has("Uncategorized") ? ["Uncategorized"] : [])];
  return orderedCats.map(cat => {
    const items = groups.get(cat);
    return `<div class="category-header">${esc(cat)} <span class="category-count">(${items.length})</span></div>` +
      items.map(r => renderCard("want_list", r, false, true)).join("");
  }).join("");
}

function renderShoppingListGrouped(rows) {
  const groups = new Map();
  rows.forEach(r => {
    const store = r.store || "Other";
    if (!groups.has(store)) groups.set(store, []);
    groups.get(store).push(r);
  });
  const storeNames = [...groups.keys()].sort((a, b) => a.localeCompare(b));
  return storeNames.map(store => {
    const items = groups.get(store);
    return `<div class="category-header">${storeLogo(store)} <span class="category-count">(${items.length})</span></div>` +
      items.map(r => renderCard(r._source, r, false, false, "gotit")).join("");
  }).join("");
}

function buyControl(tab, r, buyMode) {
  if (buyMode === "gotit") {
    const clip = tab === "digital_coupons"
      ? `<label class="buy-check clip-check"><input type="checkbox" class="clip-checkbox" data-id="${esc(r.id)}" ${r.clipped ? "checked" : ""}> Clipped ✂</label>`
      : "";
    return `<button type="button" class="btn-small got-it-btn" data-table="${esc(tab)}" data-id="${esc(r.id)}">✓ Got it</button>${clip}`;
  }
  return `<label class="buy-check"><input type="checkbox" class="buy-checkbox" data-table="${esc(tab)}" data-id="${esc(r.id)}" ${r.intending_to_buy ? "checked" : ""}> Intend to buy</label>`;
}

function renderCard(tab, r, showMatch, hideCategory, buyMode) {
  const matched = r._match || r.matches_want_list_item;
  const matchTag = (showMatch && matched)
    ? `<span class="badge match-badge">Matches: ${esc(matched)}</span>` : "";
  // On the Shopping List nothing is filtered out - expired items are flagged instead,
  // so an item never silently vanishes from the list.
  const expiredTag = (buyMode === "gotit" && isExpired(tab, r))
    ? `<span class="badge expired-badge">expired?</span>` : "";
  const addedBy = r.intending_to_buy_by
    ? ` · <span class="added-by">added by ${esc(r.intending_to_buy_by)}</span>` : "";
  if (tab === "weekly_deals") {
    return `
      <div class="deal-card ${r.notable ? "notable" : ""}">
        <div class="deal-top">
          <span class="deal-item">${esc(r.item)}${r.notable ? '<span class="badge">Notable</span>' : ''}${matchTag}${expiredTag}</span>
          <span class="deal-price">${esc(r.price || "")}${r.unit ? " / " + esc(r.unit) : ""}</span>
        </div>
        <div class="deal-meta">${storeLogo(r.store)} · ${esc(r.category)}${r.sale_end ? " · through " + esc(r.sale_end) : ""}${addedBy}</div>
        ${r.notes ? `<div class="deal-notes">${esc(r.notes)}</div>` : ""}
        ${r.source_url ? `<a class="clip-link" href="${esc(r.source_url)}" target="_blank" rel="noopener">View ad / details →</a>` : ""}
        ${buyControl(tab, r, buyMode)}
      </div>`;
  }
  if (tab === "want_list") {
    const metaParts = [];
    if (!hideCategory && r.category) metaParts.push(esc(r.category));
    if (r.priority) metaParts.push("Priority " + esc(r.priority));
    const metaLine = metaParts.length ? `<div class="deal-meta">${metaParts.join(" · ")}</div>` : "";
    return `
      <div class="deal-card">
        <div class="deal-top">
          <span class="deal-item">${esc(r.item)}</span>
          <span class="deal-price">${esc(r.best_deal_price || "—")}</span>
        </div>
        ${metaLine}
        ${r.notes ? `<div class="deal-notes">${esc(r.notes)}</div>` : ""}
        ${r.best_deal_found ? `<div class="deal-notes"><strong>Best deal:</strong> ${esc(r.best_deal_found)}${r.best_deal_store ? " at " + esc(r.best_deal_store) : ""}</div>` : ""}
        ${r.deal_source ? `<div class="deal-meta">${esc(r.deal_source)}${r.est_savings ? " · Save " + esc(r.est_savings) : ""}</div>` : ""}
        ${r.where_to_clip ? `<div class="deal-notes">${esc(r.where_to_clip)}</div>` : ""}
        <div class="card-actions">
          <button type="button" class="btn-small edit-want-btn" data-id="${esc(r.id)}">Edit</button>
          <button type="button" class="btn-small danger delete-want-btn" data-id="${esc(r.id)}" data-item="${esc(r.item)}">Delete</button>
        </div>
      </div>`;
  }
  // digital_coupons
  return `
    <div class="deal-card">
      <div class="deal-card-row">
        ${r.image_url ? `<img class="deal-thumb" src="${esc(r.image_url)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
        <div class="deal-card-body">
          <div class="deal-top">
            <span class="deal-item">${esc(r.item || r.description || "Coupon")}${matchTag}${expiredTag}</span>
            ${r.savings ? `<span class="deal-price">${esc(r.savings)}</span>` : ""}
          </div>
          <div class="deal-meta">${storeLogo(r.store)}${r.expires_on ? " · expires " + esc(r.expires_on) : ""}${addedBy}</div>
          ${r.description ? `<div class="deal-notes">${esc(r.description)}</div>` : ""}
          ${r.clip_url ? `<a class="clip-link" href="${esc(r.clip_url)}" target="_blank" rel="noopener">Clip this coupon →</a>` : ""}
          ${buyControl(tab, r, buyMode)}
        </div>
      </div>
    </div>`;
}

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[m]));
}
</script>
